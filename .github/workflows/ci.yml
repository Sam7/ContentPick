name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-core-tests:
    name: Core tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Rust core tests
        run: cargo test -p contextpick-core --locked

  checks:
    name: Checks and candidate bundle (${{ matrix.artifact_platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact_platform: windows-x64
            bundle: nsis
            bundle_path: target/release/bundle/nsis/*.exe
          - os: macos-15
            artifact_platform: macos-arm64
            bundle: dmg
            bundle_path: target/release/bundle/dmg/*.dmg
          - os: macos-15-intel
            artifact_platform: macos-x64
            bundle: dmg
            bundle_path: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck, tests, lint, and production build
        run: |
          pnpm run typecheck
          pnpm run test
          pnpm run lint
          pnpm run build

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: End-to-end tests
        run: pnpm run test:e2e

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Install pinned Rust license report generator
        run: cargo install cargo-about --version 0.9.2 --locked --root .tools/license-audit --features cli

      - name: Prepare and verify target-specific notices
        run: |
          pnpm licenses:rust ${{ matrix.artifact_platform }}
          node licenses/generate-frontend-notices.mjs
          git diff --exit-code -- licenses/generated/frontend.txt
          # The report embeds upstream license line endings; compare CRLF/LF identically without rewriting bundled text.
          git diff --ignore-cr-at-eol --exit-code -- licenses/generated/rust-${{ matrix.artifact_platform }}.html

      - name: Rust workspace tests
        run: cargo test --workspace --locked

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Native application check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Set Windows bundle source timestamp
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $epoch = (git log -1 --format=%ct).Trim()
          if ($LASTEXITCODE -ne 0 -or $epoch -notmatch '^\d+$') { throw 'Could not read the source commit timestamp.' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SOURCE_DATE_EPOCH=$epoch" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'RUSTFLAGS=-C link-arg=/Brepro' -Encoding utf8

      - name: Build Windows app (no bundle)
        if: runner.os == 'Windows'
        run: pnpm exec tauri build --no-bundle

      - name: Build macOS app (no bundle)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: cargo build --locked

      - name: Normalize Windows installer input timestamps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/normalize-bundle-inputs.mjs $env:SOURCE_DATE_EPOCH target/release/contextpick.exe LICENSE docs/design/ATTRIBUTION.md licenses/generated/frontend.txt licenses/generated/rust.html

      - name: Build unsigned Windows candidate bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pnpm exec tauri bundle --bundles nsis --no-binary-patching
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build unsigned macOS candidate bundle
        if: runner.os == 'macOS'
        run: pnpm exec tauri build --bundles dmg

      - name: Record candidate SHA-256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -Path '${{ matrix.bundle_path }}' -File)
          if ($artifacts.Count -ne 1) { throw "Expected exactly one candidate bundle, found $($artifacts.Count)." }
          $hash = (Get-FileHash -LiteralPath $artifacts[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($artifacts[0].Name)" | Set-Content -LiteralPath "$($artifacts[0].FullName).sha256" -Encoding ascii
          Get-Content -LiteralPath "$($artifacts[0].FullName).sha256"

      - name: Record candidate SHA-256 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(target/release/bundle/dmg/*.dmg)
          if [[ ${#artifacts[@]} -ne 1 ]]; then
            echo "Expected exactly one candidate bundle, found ${#artifacts[@]}." >&2
            exit 1
          fi
          shasum -a 256 "${artifacts[0]}" | tee "${artifacts[0]}.sha256"

      - name: Retain candidate bundle for review
        uses: actions/upload-artifact@v4
        with:
          name: contextpick-${{ matrix.artifact_platform }}-candidate-${{ github.run_number }}-${{ github.sha }}
          path: |
            ${{ matrix.bundle_path }}
            ${{ matrix.bundle_path }}.sha256
          if-no-files-found: error
          retention-days: 14

  installed-windows-smoke:
    name: Fresh Windows installer lifecycle (windows-2025)
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download the Windows candidate from this run
        uses: actions/download-artifact@v4
        with:
          name: contextpick-windows-x64-candidate-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/contextpick-candidate

      - name: Verify installer checksum sidecar
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'contextpick-candidate') -Filter '*.exe' -File)
          if ($artifacts.Count -ne 1) { throw "Expected one NSIS installer, found $($artifacts.Count)." }
          $installer = $artifacts[0]
          $sidecarPath = "$($installer.FullName).sha256"
          if (-not (Test-Path -LiteralPath $sidecarPath -PathType Leaf)) { throw 'Installer checksum sidecar is missing.' }
          $sidecar = (Get-Content -LiteralPath $sidecarPath -Raw).Trim()
          $pattern = '^(?<hash>[a-f0-9]{64})  ' + [regex]::Escape($installer.Name) + '$'
          $match = [regex]::Match($sidecar, $pattern)
          if (-not $match.Success) { throw "Checksum sidecar has unexpected content: $sidecar" }
          $actual = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = $match.Groups['hash'].Value
          if ($actual -cne $expected) { throw "Installer checksum mismatch: sidecar $expected, actual $actual." }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CONTEXTPICK_CANDIDATE_INSTALLER=$($installer.FullName)" -Encoding utf8
          "Verified $($installer.Name): $actual ($($installer.Length) bytes)"

      - name: Record WebView2 runtime state before install
        shell: pwsh
        run: |
          $runtimeEntries = [System.Collections.Generic.List[string]]::new()
          foreach ($hive in @([Microsoft.Win32.RegistryHive]::LocalMachine, [Microsoft.Win32.RegistryHive]::CurrentUser)) {
            foreach ($view in @([Microsoft.Win32.RegistryView]::Registry64, [Microsoft.Win32.RegistryView]::Registry32)) {
              $base = $null
              $clients = $null
              try {
                $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey($hive, $view)
                $clients = $base.OpenSubKey('SOFTWARE\Microsoft\EdgeUpdate\Clients')
                if (-not $clients) { continue }
                foreach ($subkeyName in $clients.GetSubKeyNames()) {
                  $client = $null
                  try {
                    $client = $clients.OpenSubKey($subkeyName)
                    if ([string]$client.GetValue('name') -like '*WebView2 Runtime*') {
                      $runtimeEntries.Add("$hive/$view $($client.GetValue('name')) version=$($client.GetValue('pv'))")
                    }
                  } finally { if ($client) { $client.Dispose() } }
                }
              } finally {
                if ($clients) { $clients.Dispose() }
                if ($base) { $base.Dispose() }
              }
            }
          }
          if ($runtimeEntries.Count -eq 0) { Write-Output 'WebView2 Runtime: not detected in EdgeUpdate client registry.' }
          else { $runtimeEntries | ForEach-Object { Write-Output "WebView2 Runtime: $_" } }
          Write-Output 'The Windows runner is a fresh ContextPick profile, but its bundled OS/runtime inventory is not assumed absent.'

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend test dependencies
        run: pnpm install --frozen-lockfile

      - name: Install, smoke test, and uninstall candidate
        shell: pwsh
        run: .\scripts\test-installed.ps1 -InstallerPath $env:CONTEXTPICK_CANDIDATE_INSTALLER -AllowElevatedRunner

      - name: Retain installed-app failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contextpick-installed-windows-failure-${{ github.run_number }}-${{ github.sha }}
          path: test-results/**
          if-no-files-found: ignore
          retention-days: 7
