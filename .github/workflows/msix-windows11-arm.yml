name: MSIX Windows 11 lifecycle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/msix-windows11-arm.yml'
      - 'crates/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'licenses/**'
      - 'packaging/msix/**'
      - 'scripts/**'
      - 'tests/native/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'playwright.native.config.ts'
      - 'vite.config.ts'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.github/workflows/msix-windows11-arm.yml'
      - 'crates/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'licenses/**'
      - 'packaging/msix/**'
      - 'scripts/**'
      - 'tests/native/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'playwright.native.config.ts'
      - 'vite.config.ts'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  msix-lifecycle:
    name: Clean Windows 11 25H2+ x64 MSIX lifecycle (ARM64 emulation)
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install x64 Rust target and pinned license reporter
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo install cargo-about --version 0.9.2 --locked --root .tools/license-audit --features cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build, install, exercise, upgrade, and remove Store-identity MSIX
        shell: pwsh
        run: .\scripts\test-store-msix.ps1

      - name: Retain candidate packages and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contextpick-msix-win11-arm64-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/contextpick-msix-validation/**
          if-no-files-found: warn
          retention-days: 14
