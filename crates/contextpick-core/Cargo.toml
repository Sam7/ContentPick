[package]
name = "contextpick-core"
version = "0.9.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
ignore = "0.4"
globset = "0.4"
cap-std = "3"
cap-primitives = "3"
getrandom = "0.4"
tempfile = "3"
thiserror = "2"
same-file = "1"
serde_json = "1"
tiktoken-rs = { version = "=0.12.1", default-features = false }

[dev-dependencies]
proptest = "1"
