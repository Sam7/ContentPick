[package]
name = "contextpick-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
ignore = "0.4"
globset = "0.4"
cap-std = "3"
tempfile = "3"
thiserror = "2"
same-file = "1"
serde_json = "1"

[dev-dependencies]
proptest = "1"
