# SPDX identifiers observed in the locked normal Windows/macOS graphs. This
# lets cargo-about select a branch and render the corresponding notices; BSD-3
# then MIT are prioritized to match the exact texts in two clarified crates.
# This is an inventory for disclosure, not a legal compatibility determination.
accepted = [
  "BSD-3-Clause",
  "MIT",
  "Apache-2.0",
  "BSL-1.0",
  "MPL-2.0",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "Apache-2.0 WITH LLVM-exception",
]

# Match the normal dependency closure used by the installers. Development and
# build-only tooling does not ship in the application bundle.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# These published Cargo.toml expressions use a slash in place of SPDX OR.
# Their included LICENSE files contain only the text named in each clarification.
[ident_case.clarify]
license = "MIT OR Apache-2.0"

[[ident_case.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "508a77d2e7b51d98adeed32648ad124b7b30241a8e70b2e72c99f92d8e5874d1"

[brotli-decompressor.clarify]
license = "BSD-3-Clause OR MIT"

[[brotli-decompressor.clarify.files]]
path = "LICENSE"
license = "BSD-3-Clause"
checksum = "c0c56f26d9c051cac4d200c34c84e7ae9aaa853e01a982a1df08b09931e518ae"
